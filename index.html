<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R$ 99 BOX | utilidades</title>
  <link rel="shortcut icon" href="icon.png" type="image/x-icon">

  <!-- Fontes: Inter para textos longos e Montserrat para títulos/preços de e-commerce -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --mario-blue: #5c94fc;       /* Azul clássico do céu */
      --mario-red: #e52521;        /* Vermelho do boné do Mario */
      --mario-yellow: #fcd116;     /* Amarelo dos blocos de interrogação */
      --mario-green: #43b047;      /* Verde dos canos e do Yoshi */
      --bg-dark: #0f1115;          /* Fundo escuro premium */
      --bg-card: #181b22;          /* Fundo dos cards */
      --text-white: #ffffff;
      --text-gray: #9ca3af;
      --border-game: 3px solid #000000;
      --transition: all 0.25s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-white);
      overflow-x: hidden;
    }

    /* Header / Hero */
    header {
      position: relative;
      background: radial-gradient(circle at top, #1c2b54 0%, var(--bg-dark) 80%);
      padding: 90px 20px 70px 20px;
      text-align: center;
      border-bottom: 4px solid var(--mario-blue);
    }

    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.2;
      color: var(--mario-yellow);
      text-shadow: 3px 3px 0px var(--mario-red), 6px 6px 0px #000;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }

    header p {
      font-size: 18px;
      color: var(--text-gray);
      max-width: 600px;
      margin: 0 auto 35px auto;
      font-weight: 300;
    }

    header p b {
      color: var(--mario-yellow);
      font-weight: 600;
    }

    /* Botão de Destaque estilo Bloco */
    .hero-btn {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: var(--mario-green);
      color: #fff;
      padding: 18px 36px;
      border: var(--border-game);
      box-shadow: 0 6px 0px #000;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      border-radius: 12px;
    }

    .hero-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0px #000;
      background: #4cd051;
      
    }

    .hero-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px #000;
    }

    /* Grid de Produtos */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 60px 20px;
    }

    .titulo {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 50px;
      color: var(--text-white);
      text-shadow: 3px 3px 0px var(--mario-blue);
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    /* Card Premium Mario World */
    .card {
      background: var(--bg-card);
      border: var(--border-game);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.4);
    }

    .card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 9px 9px 0px var(--mario-yellow);
      border-color: var(--mario-yellow);
    }

    /* Encaixe Perfeito para Imagens com Fundo Azul Fase do Mario */
    .img {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #202b44; /* Azul clássico escuro de fase */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      border-bottom: var(--border-game);
    }

    .img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.4));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover img {
      transform: scale(1.1) rotate(2deg);
    }

    /* Info */
    .info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .info h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-white);
    }

    .info p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-gray);
      font-weight: 300;
    }

    .preco-container {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 5px;
    }

    .preco-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--text-gray);
      letter-spacing: 1px;
    }

    .preco {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--mario-yellow);
      text-shadow: 2px 2px 0px #000;
    }

    /* Botão Card Estilo Retro */
    .btn {
      margin-top: auto;
      border: var(--border-game);
      color: var(--text-white);
      padding: 14px;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0px #000;
      transition: var(--transition);
      border-radius: 12px;
    }

    /* Mantém o comportamento de hover se você quiser uma cor padrão, 
       mas neste caso as cores de fundo individuais vão sobrescrever o background do CSS.
       Para que o hover ainda funcione de forma dinâmica, nós controlamos o hover do card */
    .card:hover .btn {
      filter: brightness(1.2); /* Deixa a cor individual ligeiramente mais clara no hover */
    }

    /* Benefícios */
    .beneficios {
      margin-top: 90px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .box {
      background: var(--bg-card);
      border: var(--border-game);
      padding: 25px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-white);
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
      transition: var(--transition);
    }

    .box:hover {
      transform: translateY(-3px);
      border-color: var(--mario-blue);
    }

    .box-icon {
      font-size: 32px;
      margin-bottom: 15px;
      display: block;
    }

    /* Rodapé */
    footer {
      background: #000000;
      color: var(--text-gray);
      text-align: center;
      padding: 40px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      border-top: var(--border-game);
    }

    /* Floating WhatsApp */
    .whats {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      background: var(--mario-green);
      border: var(--border-game);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 0px #000;
      transition: var(--transition);
      z-index: 999;
    }

    .whats svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .whats:hover {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 10px 0px #000;
      background: #4cd051;
    }

    /* Floating Instagram */
    .insta {
      position: fixed;
      bottom: 110px; /* Posicionado exatamente acima do botão do WhatsApp */
      right: 30px;
      width: 65px;
      height: 65px;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      border: var(--border-game);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 0px #000;
      transition: var(--transition);
      z-index: 999;
    }

    .insta svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .insta:hover {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 10px 0px #000;
      filter: brightness(1.1);
    }

    /* Responsividade */
    @media (max-width: 768px) {
      header {
        padding: 70px 15px 50px 15px;
      }
      header h1 {
        font-size: 36px;
        line-height: 1.3;
      }
      header p {
        font-size: 15px;
      }
      .titulo {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

    <a class="hero-btn" href="https://www.google.com/maps/search/?api=1&query=Rua+Carapicu%C3%ADba,+06326-010" target="_blank">

    <svg viewBox="0 0 24 24">

  <!-- WhatsApp SVG Icon -->

  <script>
    const whatsapp = "5511953658040";
    const produtos = [
      {

      {

        preco: "R$ 99,00",
        imagem: "carregador.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO2/" // Link do post/reels do Carregador
      },
      {
        nome: "Lavadora Portátil 48V",
        descricao: "Liberdade sem fios. Lavadora de alta pressão recarregável de alta performance para limpezas profundas em qualquer lugar.",
        preco: "R$ 99,00",
        imagem: "lavadora.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO3/" // Link do post/reels da Lavadora
      },
      {
        nome: "Soprador Elétrico",
        descricao: "A força ideal para eliminar poeira e detritos em componentes sensíveis como eletrônicos, estofados e detalhes automotivos.",
        preco: "R$ 99,00",
        imagem: "soprador.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO4/" // Link do post/reels do Soprador
      },
      {
        nome: "Kit Ferramentas Rosa",
        descricao: "Bom gosto e força. Kit somente com o essencial para fazer as manutenções do dia a dia em casas e apartamentos",
        preco: "R$ 99,00",
        imagem: "marteloRosa.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO5/" // Link do post/reels do Soprador
      },
      {
        nome: "Multímetro",
        descricao: "Funciona com alimentação por bateria inclusa, permitindo o uso imediato em diferentes pontos de verificação.",
        preco: "R$ 99,00",
        imagem: "multimetro.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO5/" // Link do post/reels do Soprador
      },
      {
        nome: "Mini Máquina de Costura",
        descricao: "Ideal para projetos de corte e alfaiataria, do mais básico ao mais criativo. Oferece uma experiência nova e prática para as costuras do seu dia a dia.",
        preco: "R$ 99,00",
        imagem: "costura.jpg",
        textoBotao: "EM ESTOQUE | VER FOTOS",
        corBotao: "var(--mario-red)", // Vermelho padrão
        linkInstagram: "https://www.instagram.com/p/EXEMPLO5/" // Link do post/reels do Soprador
      }
    ];


    const grid = document.getElementById("produtos");

    produtos.forEach(produto => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="img">
          <img src="${produto.imagem}" alt="${produto.nome}">
        </div>
        <div class="info">
          <h2>${produto.nome}</h2>
          <p>${produto.descricao}</p>
          <div class="preco-container">
            <span class="preco-label">PREÇO</span>
            <div class="preco">${produto.preco}</div>
          </div>
          <!-- Aplicando a cor individual como estilo de fundo do botão -->
          <div class="btn" style="background-color: ${produto.corBotao};">
            ${produto.textoBotao}
          </div>
        </div>
      `;

      // Evento de clique no botão (Redireciona para o Instagram específico)
      card.querySelector('.btn').onclick = (e) => {
        e.stopPropagation(); // Impede que o clique no botão ative o clique do card (WhatsApp)
        window.open(produto.linkInstagram, "_blank");
      };

      // Evento de clique no card (Redireciona para o WhatsApp para comprar)
      card.onclick = () => {
        const mensagem = `Olá! Gostaria de adquirir o produto:\n\n*${produto.nome}* (R$ 99,00)\n\nComo posso finalizar a compra?`;
        window.open(
          `https://wa.me/${whatsapp}?text=${encodeURIComponent(mensagem)}`,
          "_blank"
        );
      }
      grid.appendChild(card);
    });
  </script>
